<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="assets/favicon.png"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>책꼬리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gaegu:wght@700&family=Hahmlet:wght@400;600;800&family=IBM+Plex+Sans+KR:wght@400;600;700&family=Jua&family=Song+Myung&display=swap">
<style>
/* Layout: 학교 도서관 — 표지가 게시물처럼 쌓이는 우리 반 피드, 줄 그은 목록 카드(미션), 대출증(작가 명함), 불 꺼진 시청각실(시사회). */
:root{
  --bg:#EDF1EE; --surface:#FAFBF9; --sunk:#E1E7E3; --ink:#16201C; --sub:#55635C; --line:#C9D3CD;
  --acc:#1D6A56; --acc-hi:#155443; --on-acc:#FFFFFF; --mark:#F3D34F; --mark-ink:#3A3000; --warn:#B23F2B; --warn-soft:#F7E3DE; --heart:#D9443A;
  --rule:rgba(29,106,86,.16);
  --f-display:'Hahmlet','AppleMyungjo','Batang',serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#17201C; --sunk:#1E2925; --ink:#E5ECE8; --sub:#98A9A1; --line:#2B3833;
  --acc:#6BC3A5; --acc-hi:#8AD6BC; --on-acc:#0C1311; --mark:#E2C243; --mark-ink:#241D00; --warn:#FF8B73; --warn-soft:#3A1F19; --heart:#FF6B5E;
  --rule:rgba(107,195,165,.14); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#17201C; --sunk:#1E2925; --ink:#E5ECE8; --sub:#98A9A1; --line:#2B3833;
  --acc:#6BC3A5; --acc-hi:#8AD6BC; --on-acc:#0C1311; --mark:#E2C243; --mark-ink:#241D00; --warn:#FF8B73; --warn-soft:#3A1F19; --heart:#FF6B5E;
  --rule:rgba(107,195,165,.14); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,label:focus-within>span.btn{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance;font-family:var(--f-display);font-weight:800}
p{margin:0}
.wrap{max-width:980px;margin:0 auto}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.sub{color:var(--sub);font-size:14px}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--sub)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{border-bottom:1px solid var(--line);margin-bottom:4px}
.top .wrap{min-height:60px;padding-block:8px}
.logo{font-family:var(--f-display);font-weight:800;font-size:20px;background:none;border:0;padding:0;display:flex;align-items:center;gap:10px}
.logo i{display:flex;gap:2px;align-items:flex-end;height:22px}
.logo i b{width:5px;border-radius:1px;background:var(--acc)}
.meta{font-size:14px;color:var(--sub);display:inline-flex;align-items:center;gap:6px}
.meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.ticket{background:var(--mark);color:var(--mark-ink);border-radius:6px;padding:3px 10px;font-weight:700}
.ticket b{color:var(--mark-ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:0 16px;font-weight:600;min-height:44px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.pri:hover{background:var(--acc-hi);border-color:var(--acc-hi)}
.btn.ghost{background:none;border-color:transparent;color:var(--sub)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.sm{padding:0 12px;min-height:36px;font-size:14px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;min-height:38px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:6px 14px;font-weight:700;font-size:14px;color:var(--sub);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* tabs */
.tabs{display:flex;gap:2px;align-items:center;margin:12px 0 22px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:12px 12px;font-weight:600;color:var(--sub);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--acc)}
.tabs .btn{flex:none;margin-left:auto}

/* cover (fixed print palettes, readable on either theme) */
.cover{position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:2px 6px 6px 2px;box-shadow:inset 6px 0 0 rgba(0,0,0,.2);container-type:inline-size;width:100%;max-width:100%}
.cover::after{content:"";position:absolute;inset:3cqw 3cqw 3cqw 8cqw;border:1px solid rgba(255,255,255,.35);pointer-events:none;z-index:6}
.c-photo,.c-draw{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.c-draw{object-fit:contain;z-index:2}
.c-photo{z-index:1}
.c-title{position:absolute;left:13%;right:9%;top:13%;text-align:center;color:#fff;font-family:var(--f-display);font-weight:800;font-size:9cqw;line-height:1.3;word-break:keep-all;pointer-events:none;z-index:3;text-shadow:0 1px 3cqw rgba(0,0,0,.35)}
.c-title.pos-mid{top:50%;transform:translateY(-50%)}
.c-title.pos-bot{top:auto;bottom:15%}
.c-title.free{right:auto;bottom:auto;width:80%;transform:translate(-50%,-50%)}
.mode-title .c-title{pointer-events:auto;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;outline:2px dashed rgba(255,255,255,.85);outline-offset:4px}
.c-stk{position:absolute;transform:translate(-50%,-50%);line-height:1;z-index:4;user-select:none;-webkit-user-select:none}
.c-st{position:absolute;bottom:7%;color:#fff;font-size:10cqw;line-height:1;z-index:5}
.c-ribbon{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;text-align:center;font-size:5.5cqw;font-weight:700;padding:2cqw 0;z-index:5}
.c-read{position:absolute;right:6%;top:5%;width:22cqw;height:22cqw;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:6cqw;font-weight:800;transform:rotate(-12deg);background:rgba(0,0,0,.25);z-index:5}

/* feed */
.feed-head{display:flex;gap:14px;align-items:end;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.feed-head h1{font-size:28px}
.filters{margin-bottom:18px}
.filters-wrap{display:grid;gap:4px;justify-items:start;margin-bottom:18px}
.filters-wrap .filters{margin:0}
.chips.folded{max-height:40px;overflow:hidden}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.p-head{display:flex;align-items:center;gap:10px;padding:10px 12px}
.p-head > div{min-width:0;line-height:1.3}
.p-head b{display:block;font-size:14px}
.p-head span{font-size:12px;color:var(--sub)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--mark)}
.p-mood{margin-left:auto;font-size:12px;font-weight:700;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:1px 10px;flex:none}
.p-cover{border:0;padding:0;background:var(--sunk);display:block;width:100%}
.p-cover .cover{border-radius:0;box-shadow:none}
.p-acts{display:flex;align-items:center;gap:4px;padding:6px 6px 0}
.p-acts button{border:0;background:none;width:40px;height:40px;display:grid;place-items:center;border-radius:8px}
.p-acts button:hover{background:var(--sunk)}
.p-acts .ic{width:24px;height:24px}
.p-acts [aria-pressed="true"] .ic{fill:var(--heart);stroke:var(--heart)}
.p-acts .read{color:var(--acc)}
.p-body{padding:2px 14px 14px;display:grid;gap:4px;font-size:15px}
.p-likes{font-weight:700;font-variant-numeric:tabular-nums}
.p-cap b{margin-right:6px}
.p-cap q{font-family:var(--f-display);quotes:"“" "”";display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p-tags{display:flex;gap:6px;flex-wrap:wrap}
.p-tags span{font-size:13px;color:var(--acc);font-weight:600}
.p-more{border:0;background:none;padding:0;color:var(--sub);text-align:left;font-size:14px}
.p-meta{font-size:12px;color:var(--sub);letter-spacing:.02em}
.vote-badge{font-size:12px;font-weight:700;background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:1px 6px;margin-left:6px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.panel h2{font-size:20px;margin-bottom:2px}
.orig{padding:4px 0;display:grid;gap:12px;font-size:15px}
.orig a{color:var(--acc);font-weight:600}
.certs{display:grid;gap:6px}
.cert{display:flex;gap:8px;align-items:baseline;font-size:14px;flex-wrap:wrap}
.cert b{flex:none}
.cert .tg{flex:none;font-size:12px;font-weight:700;color:var(--acc);border:1px solid currentColor;border-radius:4px;padding:0 6px}
.cert q{font-family:var(--f-display);color:var(--sub);quotes:"“" "”"}

/* story cards (시사회·명함에서 재사용) */
.scard{display:flex;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;width:100%}
.scard:hover{border-color:var(--ink)}
.scard .mini{width:64px;flex:none}
.scard > div:last-child{min-width:0}
.scard h3{font-size:17px}

/* story page */
.back{background:none;border:0;padding:14px 0;color:var(--sub);font-weight:600}
.sthead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:14px}
.sthead h1{font-size:28px}
.story-wrap{max-width:820px;margin:0 auto}
.reader{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:40px 28px;min-height:44vh;display:flex;flex-direction:column;justify-content:center;
  background-image:repeating-linear-gradient(transparent 0 calc(2.3em - 1px),var(--rule) calc(2.3em - 1px) 2.3em);background-position:0 18px}
.rby{color:var(--sub);font-size:14px;margin-bottom:18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rtext{white-space:pre-line;font-family:var(--f-display);font-weight:400;font-size:clamp(22px,4.4vw,28px);line-height:1.9;word-break:keep-all}
.rprog{height:4px;background:var(--line);margin:14px 0;border-radius:2px}
.rprog i{display:block;height:100%;background:var(--acc);border-radius:2px;transition:width .3s}
.rnav{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:0 0 22px}
.rnav .cnt{color:var(--sub);font-weight:600;font-variant-numeric:tabular-nums}
.ctx{border-left:3px solid var(--acc);margin:0 0 16px;padding:4px 16px;font-family:var(--f-display);color:var(--sub);font-size:18px;line-height:1.8;word-break:keep-all}
.lockbox{padding:16px;border:1.5px dashed var(--line);border-radius:var(--r);margin:14px 0 16px;display:grid;gap:12px}
.mtag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:1px 8px}
.cand{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;position:relative;overflow:hidden}
.cand:not([disabled]):hover{border-color:var(--ink)}
.cand[disabled]{cursor:default}
.cand .lab{font-weight:700;color:var(--acc);font-size:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cand .bar{position:absolute;left:0;top:0;bottom:0;background:var(--sunk);z-index:0;transition:width .6s}
.cand>*{position:relative;z-index:1}
.cand .tx{font-family:var(--f-display);font-size:17px}
.cand.mine{border-color:var(--ink)}
textarea,input[type=text],input[type=password]{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);color:var(--ink)}
textarea:focus,input[type=text]:focus,input[type=password]:focus{outline:none;border-color:var(--acc)}
textarea{resize:vertical;min-height:88px}
.fl{display:block;font-weight:600;font-size:15px;margin:16px 0 6px}
.counter{text-align:right;font-size:13px;color:var(--sub);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.moods{display:flex;gap:8px;flex-wrap:wrap}
.moods label{cursor:pointer;position:relative}
.moods input{position:absolute;opacity:0}
.moods span{display:inline-block;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.moods input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.moods input:focus-visible+span{outline:3px solid var(--acc);outline-offset:2px}

/* 이어쓰기 약속 */
.promise{border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);padding:12px 14px;margin:8px 0 12px;font-size:14px}
.promise b{display:block;font-size:14px;margin-bottom:6px}
.promise ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.promise li{display:flex;gap:8px;align-items:flex-start}
.promise li .ic{color:var(--acc);width:16px;height:16px;margin-top:3px}
.promise li.no .ic{color:var(--warn)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600;margin-bottom:8px}

/* mission card = 도서관 목록 카드 */
.mcard{position:relative;border:1px solid var(--line);border-radius:4px;padding:14px 16px 26px;margin:6px 0 14px;
  background-color:var(--surface);background-image:linear-gradient(90deg,transparent 0 30px,rgba(178,63,43,.35) 30px 31px,transparent 31px),repeating-linear-gradient(transparent 0 25px,var(--rule) 25px 26px);background-position:0 0,0 40px}
.mcard.off{opacity:.55}
.mc-top{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--sub);padding-left:24px;flex-wrap:wrap}
.mc-cat{color:var(--acc)}
.mc-text{font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.4;padding:8px 0 10px 24px}
.mc-how{font-size:14px;color:var(--sub);padding-left:24px;margin-bottom:10px}
.mc-act{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-left:24px}
.mc-act label{display:inline-flex;gap:8px;align-items:center;font-weight:600;font-size:14px;cursor:pointer}
.mc-act input{width:20px;height:20px;accent-color:var(--acc)}
.mc-hole{position:absolute;left:50%;bottom:7px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:1px solid var(--line);transform:translateX(-50%)}
.bonus{font-size:12px;background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 6px;font-weight:700}

/* name card = 도서관 대출증 */
.idcard{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface);margin-bottom:16px;display:grid;grid-template-columns:auto 1fr}
.id-side{background:var(--idc,#1D6A56);color:#fff;padding:20px 16px;display:grid;align-content:space-between;gap:14px;width:150px}
.id-side .avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.22);font-size:34px;font-weight:800;font-family:var(--f-display);line-height:1}
.id-wn{font-family:var(--f-display);font-weight:800;font-size:17px;margin-top:8px;word-break:break-all;line-height:1.25}
.id-side .lbl{font-size:11px;font-weight:700;letter-spacing:.14em;opacity:.85}
.id-side .no{font-family:var(--f-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.barcode{display:flex;gap:1px;height:34px;width:100%;align-items:stretch;background:#fff;padding:4px;border-radius:3px;overflow:hidden}
.id-bc{width:100%;min-width:0}
.barcode i{background:#111;display:block;flex:0 1 auto;min-width:1px}
.id-main{padding:22px 22px 18px;display:grid;gap:14px;min-width:0}
.id-name{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,5vw,36px);line-height:1.15}
.id-type{font-size:18px;font-weight:700;color:var(--acc)}
.id-line{font-family:var(--f-display);font-size:18px;line-height:1.6;border-left:3px solid var(--mark);padding-left:12px;word-break:keep-all}
.id-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.id-grid div{padding:10px 4px;text-align:center;border-right:1px solid var(--line)}
.id-grid div:last-child{border-right:0}
.id-grid b{display:block;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.id-grid span{font-size:12px;color:var(--sub)}
.id-books{display:flex;gap:6px;flex-wrap:wrap}
.id-books span{font-size:13px;border:1px solid var(--line);border-radius:4px;padding:2px 8px}
.edit{display:grid;gap:10px}
.pickline{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;font-family:var(--f-display);font-size:15px}
.pickline[aria-pressed="true"]{border-color:var(--acc);background:var(--sunk)}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:18px}
.gitem{background:none;border:0;padding:0;text-align:left}
.gitem small{display:block;margin-top:6px;font-size:13px;color:var(--sub)}
.empty{padding:28px 0;color:var(--sub)}
.sec-t{font-size:20px;margin:26px 0 12px}

/* screening */
.marquee{background:var(--ink);color:var(--bg);border-radius:14px;padding:26px 24px;display:grid;gap:12px;margin-bottom:18px}
.marquee h2{font-size:clamp(28px,5vw,38px)}
.marquee p{opacity:.85;max-width:36em}
.marquee .btn.pri{justify-self:start}
.lineup{display:grid;gap:8px}
.lurow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lu{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px}
.lu-main{display:grid;grid-template-columns:auto 56px minmax(0,1fr) auto;gap:14px;align-items:center;cursor:pointer;min-width:0}
.lu-main > div{min-width:0}
.lu-edit{border-top:1px dashed var(--line);padding:14px;display:grid;gap:10px;background:var(--sunk)}
.lu-edit .lbl{font-size:13px;font-weight:700;color:var(--sub)}
.lu-edit .row{display:flex;gap:8px;flex-wrap:wrap}

}

/* 체험용 계정: 코드에 들어 있어서 누구나 쓸 수 있다. 실제 DB를 붙일 때는 지운다. */
const DEMO_ACC={'테스트':'1234'};
/* 교사용 투표 마감 번호. 코드를 열면 보이므로 체험용 보호 장치다 */
const TEACHER_PIN='3690';
const NAME_BAD=/[\/\\.#$\[\]]|^__/;
const Auth={
  exists(n){return has(DEMO_ACC,n)||has(this._all(),n)},
  _all(){try{return JSON.parse(localStorage.getItem(ACC_KEY))||{}}catch(e){return {}}},
  _put(a){try{localStorage.setItem(ACC_KEY,JSON.stringify(a));return true}catch(e){return false}},
  check(nick,pin,cls){
    if(CLOUD&&!cls)return '학급 코드를 적어 주세요';
    if(CLOUD&&(cls.length>20||NAME_BAD.test(cls)))return '학급 코드를 다시 확인해 주세요';
    if(nick.length<2||nick.length>10)return '아이디는 2~10자로 적어 주세요';
    if(NAME_BAD.test(nick))return '아이디에는 / . # $ [ ] 를 쓸 수 없어요';
    if(!/^\d{4}$/.test(pin))return '비밀번호는 숫자 4자리예요';
    return '';
  },
  async signup(nick,pin,cls){
    const bad=this.check(nick,pin,cls);if(bad)return {ok:false,msg:bad};
    if(CLOUD)return Cloud.signup(cls,nick,pin);
    const all=this._all();
    if(has(all,nick)||has(DEMO_ACC,nick))return {ok:false,msg:'이미 있는 아이디예요'};
    all[nick]={pin,created:Date.now()};
    if(!this._put(all))return {ok:false,msg:'이 브라우저에서는 계정을 저장할 수 없어요'};
    return {ok:true};
  },
  async login(nick,pin,cls){
    const bad=this.check(nick,pin,cls);if(bad)return {ok:false,msg:bad};
    if(CLOUD)return Cloud.login(cls,nick,pin);
    const all=this._all(),acc=has(DEMO_ACC,nick)?{pin:DEMO_ACC[nick]}:(has(all,nick)?all[nick]:null);
    if(!acc||acc.pin!==pin)return {ok:false,msg:'아이디 또는 비밀번호가 맞지 않아요'};
    return {ok:true};
  }
};

/* 계정별 진행 데이터: 이야기(stories)는 모두가 같이 보고, 아래 항목은 계정마다 따로 가진다.
   로그아웃할 때 S.users[별명]에 넣어 두고, 로그인할 때 꺼내 온다. */
const USERF=['passes','viewed','mine','myVotes','liked','drawer','written','adopted','log','card','day'];
function stashUser(){
  if(!S.me.name)return;
  const u={};USERF.forEach(k=>u[k]=S[k]);S.users[S.me.name]=u;
}
function enterUser(nick,u){
  if(!u)u=has(S.users,nick)?S.users[nick]:newUser();
  const d=newUser();USERF.forEach(k=>S[k]=u[k]!==undefined?u[k]:d[k]);S.me.name=nick;save();
}
/* 예전 저장 데이터(계정 도입 전)와 계정이 없는 로그인 상태를 정리 (체험 모드) */
if(!CLOUD){
  if(!S.users){S.users={};stashUser()}
  if(S.me.name&&!Auth.exists(S.me.name)){stashUser();S.me.name=''}
}

/* ---------- 반 전체 공유 (Firebase) ----------
   데이터 위치: classes/{학급코드}/accounts/{아이디} = {pin(해시), created, u(계정별 진행 데이터)}
              classes/{학급코드}/stories/{이야기id} = story
              classes/{학급코드}/certs/{자동id}     = {book, by, tag, line, at}
   이야기를 바꾸는 일은 모두 mutStory()를 거친다. 여러 기기가 동시에 투표해도 표가 사라지지 않게 트랜잭션으로 저장한다. */
const clean=o=>JSON.parse(JSON.stringify(o));
const Sess={
  get(){try{return JSON.parse(localStorage.getItem(SESSION_KEY))}catch(e){return null}},
  set(v){try{v?localStorage.setItem(SESSION_KEY,JSON.stringify(v)):localStorage.removeItem(SESSION_KEY)}catch(e){}}
};
const lastCls=()=>{try{return localStorage.getItem(LASTCLS_KEY)||''}catch(e){return ''}};
const Cloud={db:null,cls:'',unsub:[],ready:false,userTimer:null,
  init(){if(!CLOUD||this.db)return;if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);this.db=firebase.firestore()},
  acc(cls,nick){return this.db.collection('classes').doc(cls).collection('accounts').doc(nick)},
  col(n){return this.db.collection('classes').doc(this.cls).collection(n)},
  err(e){return e&&e.code==='permission-denied'?'학급 코드가 맞지 않아요':'연결이 불안정해요. 잠시 뒤에 다시 해 주세요'},
  async hash(cls,nick,pin){
    const t='chaekkkori|'+cls+'|'+nick+'|'+pin;
    if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
    return 'h'+hashNum(t);
  },
  async signup(cls,nick,pin){
    this.init();
    try{
      const ref=this.acc(cls,nick),h=await this.hash(cls,nick,pin),u=newUser();
      const ok=await this.db.runTransaction(async t=>{const d=await t.get(ref);if(d.exists)return false;t.set(ref,{pin:h,created:Date.now(),u});return true});
      return ok?{ok:true,u}:{ok:false,msg:'이미 있는 아이디예요'};
    }catch(e){return {ok:false,msg:this.err(e)}}
  },
  async login(cls,nick,pin){
    this.init();
    try{
      const d=await this.acc(cls,nick).get();
      if(!d.exists||d.data().pin!==await this.hash(cls,nick,pin))return {ok:false,msg:'아이디 또는 비밀번호가 맞지 않아요'};
      return {ok:true,u:d.data().u||newUser()};
    }catch(e){return {ok:false,msg:this.err(e)}}
  },
  async resume(cls,nick){
    this.init();
    try{const d=await this.acc(cls,nick).get();return d.exists?{ok:true,u:d.data().u||newUser()}:{ok:false}}catch(e){return {ok:false}}
  },
  start(cls){
    this.init();this.stop();this.cls=cls;this.ready=false;
    let st=false,ce=false;
    const done=()=>{if(st&&ce){this.ready=true;scheduleRender()}};
    const fail=()=>toast('우리 반 책장을 불러오지 못했어요. 인터넷 연결을 확인해 주세요');
    this.unsub.push(this.col('stories').onSnapshot(qs=>{
      S.stories=qs.docs.map(d=>d.data()).sort((a,b)=>(b.created||0)-(a.created||0));st=true;syncAdopted();done()},fail));
    this.unsub.push(this.col('certs').onSnapshot(qs=>{
      const c={};qs.docs.map(d=>d.data()).sort((a,b)=>(a.at||0)-(b.at||0)).forEach(x=>{(c[x.book]=c[x.book]||[]).push(x)});
      S.certs=c;ce=true;done()},fail));
  },
  stop(){this.unsub.forEach(f=>f());this.unsub=[];this.ready=false},
  saveUser(){if(!S.me.name||!this.db)return;clearTimeout(this.userTimer);this.userTimer=setTimeout(()=>this.saveUserNow(),500)},
  saveUserNow(){
    clearTimeout(this.userTimer);if(!S.me.name||!this.db||!this.cls)return;
    const u={};USERF.forEach(k=>u[k]=S[k]);
    this.acc(this.cls,S.me.name).update({u:clean(u)}).catch(()=>toast('내 기록을 저장하지 못했어요. 인터넷 연결을 확인해 주세요'));
  },
  async mut(id,fn){
    const ref=this.col('stories').doc(id);
    try{return await this.db.runTransaction(async t=>{
      const d=await t.get(ref);if(!d.exists)return false;
      const s=d.data(),r=fn(s);if(r===false)return false;t.set(ref,clean(s));return r})}
    catch(e){toast('저장하지 못했어요. 인터넷 연결을 확인해 주세요');return false}
  },
  add(s){this.col('stories').doc(s.id).set(clean(s)).catch(()=>toast('이야기를 저장하지 못했어요. 인터넷 연결을 확인해 주세요'))},
  cert(c){this.col('certs').add(clean(c)).catch(()=>toast('인증을 저장하지 못했어요. 인터넷 연결을 확인해 주세요'))}
};
/* 이야기 하나를 바꾼다: 이 기기 화면에 먼저 반영하고, 반 전체 공유 모드면 서버에도 같은 변경을 트랜잭션으로 적용한다.
   fn은 story를 직접 고치고, 바꾸지 않을 때는 false를 돌려준다. 서버에서 여러 번 다시 실행될 수 있으니 fn 안에서 다른 값은 건드리지 않는다. */
async function mutStory(id,fn){
  const s=story(id),r=s?fn(s):false;
  if(!CLOUD){if(r!==false)save();return r}
  if(r===false)return false;
  return Cloud.mut(id,fn);
}
/* 내가 쓴 후보 글이 장면으로 채택됐는지 확인해서 '채택' 수를 올린다 */
function syncAdopted(){
  if(!S.me.name)return;let ch=false;
  S.log.forEach(l=>{
    if(l.adopted||!l.candId)return;
    if(S.stories.some(s=>s.id===l.storyId&&s.segments.some(g=>g.candId===l.candId))){l.adopted=true;S.adopted++;ch=true}
  });
  if(ch)save();
}
/* 다른 기기에서 바뀐 내용을 화면에 반영한다. 글을 쓰는 중이거나 표지를 만드는 중, 예고편을 보는 중에는 끝난 뒤로 미룬다. */
let pendingRender=false;
function scheduleRender(){
  if(!S.me.name)return;
  const a=document.activeElement,typing=a&&a.matches&&a.matches('textarea,input[type=text],input[type=password],input[type=range]');
  if(typing||parse().p==='new'||!$('#trailer').hidden){pendingRender=true;return}
  render(true);
}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pendingRender)scheduleRender()},0));

/* ============ 작가의 서재 (작가 대출증) ============ */
const AVATARS=['🦊','🐰','🐢','🐯','🐻','🐼','🐦','🐟','🦉','🐸','🦁','🐧'];
function barcode(str){let h=hashNum(str||'작가');let out='';for(let i=0;i<34;i++){h=(h*1103515245+12345)>>>0;out+=`<i style="width:${1+(h>>>28)%3}px"></i>`}return out}
function writerType(){
  const log=S.log;
  if(!log.length)return {type:'첫 문장을 기다리는 작가',sub:'이야기를 이어 쓰면 나만의 작가 유형이 만들어져요.'};
  const cnt=arr=>arr.reduce((m,k)=>(k&&(m[k]=(m[k]||0)+1),m),{});
  const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0];
  const tm=top(cnt(log.map(l=>l.mood))), tc=top(cnt(log.map(l=>l.cat)));
  const adj=tm?MOODS[tm[0]].adj:'';
  const type=tc?MCATS[tc[0]].type:'이야기 잇는 작가';
  const sub=tc?`가장 많이 받은 미션은 '${MCATS[tc[0]].label}' (${tc[1]}번)`:'미션 카드를 넣어 쓰면 유형이 더 또렷해져요.';
  return {type:`${adj} ${type}`.trim(),sub};
}

function storyView(id){
  const s=story(id);
  if(!s)return `<main class="wrap"><button class="back" data-act="tab" data-tab="shelf">← 책장</button><p>이야기를 찾을 수 없어요.</p></main>`;
  const open=unlocked(s),n=s.segments.length,last=n-1;
  const pg=open?Math.min(ui.pg[s.id]||0,n):0,onAction=open&&pg===n;
  const passage=(x,i)=>`<article class="reader" aria-live="polite"><div class="rby">${esc(x.by)} · ${i+1}번째 장면 ${mtag(x.mission)}</div><p class="rtext">${esc(x.text)}</p></article>`;
  let main='';
  if(open&&pg<n){
    main=passage(s.segments[pg],pg)+`<div class="rprog"><i style="width:${Math.round((pg+1)/(n+1)*100)}%"></i></div>
      <div class="rnav"><button class="btn" data-act="pg" data-id="${s.id}" data-d="-1" ${pg===0?'disabled':''}>← 이전</button><span class="cnt">${pg+1} / ${n}</span>
      <button class="btn pri" data-act="pg" data-id="${s.id}" data-d="1">${pg===last?(s.voteOpen?'투표하기 →':'이어 쓰기 →'):'다음 →'}</button></div>`;
  }else if(open){
    main=`<button class="back" data-act="pg" data-id="${s.id}" data-d="-1">← 마지막 장면 다시 읽기</button>
      <blockquote class="ctx">${esc(s.segments[last].text)}</blockquote>`;
  }else{
    main=`<div class="lockbox"><div style="width:120px">${coverHTML(s.cover)}</div><p>이 책은 열람권 ${OPEN_COST}장을 내면 들어갈 수 있어요. 들어가면 앞 내용을 처음부터 읽고, 이어 쓸 수 있어요. 이어 쓰면 열람권 ${WRITE_REWARD}장을 받아요.</p>
      <button class="btn pri" data-act="unlockgo" data-id="${s.id}" style="justify-self:start" ${S.passes<OPEN_COST?'disabled':''}>${ic('ticket')} 열람권 ${OPEN_COST}장 내고 들어가기 (남은 ${S.passes}장)</button>
      ${S.passes<OPEN_COST?'<p class="sub">열람권이 없어요. 새 릴레이를 시작하거나 다른 이야기를 이어 쓰거나 원작을 읽으면 받아요.</p>':''}</div>`;
  }
  let vote='';
  if(s.voteOpen){
    const mine=S.myVotes[s.id],voted=s.cands.some(c=>c.id===mine),tv=totalVotes(s);
    vote=`<div class="panel"><h2>어느 이야기가 더 좋아요?</h2>
      <div class="sub" style="margin-bottom:12px">후보는 먼저 쓴 3명까지예요. 한 글이 <b>${ADOPT_OVER}표를 넘게</b>(${ADOPT_OVER+1}표) 받으면 다음 장면으로 채택돼요.</div>
      ${s.cands.map((c,i)=>{const own=c.by===S.me.name;
        return `<button class="cand ${voted&&c.id===mine?'mine':''}" ${voted||own?'disabled':''} data-act="vote" data-id="${s.id}" data-c="${c.id}">
        ${voted?`<div class="bar" style="width:${tv?Math.round(c.votes/tv*100):0}%"></div>`:''}
        <div class="lab">${'ABC'[i]}${own?' · 내가 쓴 글':''}${voted?` · ${esc(c.by)} · ${c.votes}표${c.id===mine?' · 내 선택':''}`:''} ${mtag(c.mission)}</div>
        <div class="tx">${esc(c.text)}</div></button>`}).join('')}
      <div class="sub">${voted?`투표했어요. 한 글이 ${ADOPT_OVER+1}표를 받으면 이어 붙어요.`:'누가 썼는지는 투표한 뒤에 보여요. 내가 쓴 글에는 투표할 수 없어요.'}</div>
      ${tv>=2?`<button class="btn sm ghost" style="margin-top:10px" data-act="closevote" data-id="${s.id}">투표 마감 (교사용)</button>`:''}</div>`;
  }
  const wrote=s.cands.some(c=>c.by===S.me.name);
  let write;
  if(s.voteOpen&&s.cands.length>=MAX_CANDS)write=`<div class="panel"><h2>다음 장면 쓰기</h2><p class="sub">선착순 ${MAX_CANDS}명의 후보가 모두 찼어요. 한 글이 채택되면 다음 장면을 쓸 수 있어요.</p></div>`;
  else if(wrote)write=`<div class="panel"><h2>다음 장면 쓰기</h2><p class="sub">내 글이 후보로 올라가 있어요. 투표가 끝나면 결과가 반영돼요.</p></div>`;
  else write=`<div class="panel"><h2>다음 장면 쓰기</h2><p class="sub" style="margin:2px 0 4px">${MAX_LEN}자까지 쓸 수 있어요. 쓰면 열람권 ${WRITE_REWARD}장을 받아요.${s.voteOpen?` 지금 후보는 ${s.cands.length}/${MAX_CANDS}명이고, 선착순으로 마감돼요.`:''}</p>
      ${promiseHTML()}
      ${missionHTML(s.id)}
      <textarea id="wtext" data-id="${s.id}" maxlength="${MAX_LEN}" placeholder="예) 그때 문이 천천히 열렸어요. 문 너머에서 누군가 나를 부르는 소리가 들렸어요." aria-label="다음 장면"></textarea>
      <div class="counter"><span id="wcnt">0</span>/${MAX_LEN}</div>
      <div id="wwarn" class="warnbox" hidden></div>
      <button class="btn pri" data-act="write" data-id="${s.id}">등록</button></div>`;
  return `<main class="wrap story-wrap"><button class="back" data-act="tab" data-tab="shelf">← 책장</button>
    <div class="sthead"><h1>${esc(s.title)}</h1><span class="sub">원작 『${esc(s.book.title)}』 · ${MOODS[s.mood].label}</span><span class="sp"></span>${open?`<button class="btn sm" data-act="trailer" data-id="${s.id}">${ic('film')} 예고편 보기</button>`:''}</div>
    ${main}${onAction?vote+write+(open?`<div class="panel">${recBox(s.book)}</div>`:''):''}</main>`;
}

function modalHTML(){
  const m=ui.modal;if(!m)return '';
  if(m.type==='part'){
    const s=story(m.storyId);
    const c={...s.cover,stickers:m.stickers,ribbon:m.ribbon};
    return `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">참여 표지</h2>
      <p class="sub">스티커(3개까지)와 띠지를 고르면 서랍에 보관돼요.</p><div class="mc">${coverHTML(c)}</div>
      <div class="stks" role="group" aria-label="스티커">${STICKERS.map(x=>`<button class="tb ${m.stickers.includes(x)?'on':''}" data-act="mstk" data-s="${x}" aria-pressed="${m.stickers.includes(x)}">${x}</button>`).join('')}</div>
      <div class="stks" role="group" aria-label="띠지">${RIBBONS.map(x=>`<button class="btn sm ${m.ribbon===x?'on':''}" data-act="mrib" data-r="${x}">${x}</button>`).join('')}</div>
      <button class="btn pri" data-act="savepart" style="width:100%">서랍에 보관</button></div></div>`;
  }
  if(m.type==='dice'){
    if(m.rolling)return `<div class="modal-bg"><div class="modal dice" role="dialog" aria-modal="true" aria-label="랜덤 책을 뽑는 중"><div class="dice-roll">${ic('dice')}</div><p class="sub">어떤 책이 나올까요?</p></div></div>`;
    const s=story(m.id);if(!s)return '';
    const read=!!myCert(s.book.title),people=new Set(s.segments.map(x=>x.by)).size;
    return `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt" style="text-align:center;justify-items:center">
      <span class="eyebrow">오늘의 랜덤 책</span><h2 id="mt">${esc(s.title)}</h2>
      <div class="mc" style="width:150px">${coverHTML(s.cover,read)}</div>
      <p class="sub">원작 『${esc(s.book.title)}』 · ${MOODS[s.mood].label}<br>장면 ${s.segments.length}개 · 친구 ${people}명${s.voteOpen?' · 투표 중':''}</p>
      <p class="p-cap"><q>${esc(s.segments[0].text)}</q></p>
      <div class="row" style="justify-content:center"><button class="btn pri" data-act="dicego" data-id="${s.id}">이 이야기 읽으러 가기</button><button class="btn" data-act="dice">${ic('dice')} 다시 굴리기</button></div>
      <button class="btn sm ghost" data-act="mclose">닫기</button></div></div>`;
  }
  if(m.type==='unlock'){
    const s=story(m.id),can=S.passes>=OPEN_COST;
    return `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">이 책 열어 볼까요?</h2>
      <div class="mc">${coverHTML(s.cover)}</div>
      <p class="sub" style="text-align:center">『${esc(s.title)}』에 들어가면 앞 내용을 처음부터 읽고 이어 쓸 수 있어요.<br>열람권 <b>${OPEN_COST}장</b>을 써요. (남은 ${S.passes}장)</p>
      ${can?'':'<p class="sub" style="text-align:center;color:var(--warn)">열람권이 부족해요. 새 릴레이를 시작하거나 원작을 읽으면 받아요.</p>'}
      <div class="row"><button class="btn pri" data-act="unlockgo" data-id="${s.id}" ${can?'':'disabled'}>${ic('ticket')} 열람권 쓰고 들어가기</button><button class="btn ghost" data-act="mclose">다음에 할게요</button></div></div></div>`;
  }
  if(m.type==='cert'){
    return `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">원작 읽기 인증</h2>
      <p class="sub">『${esc(m.book)}』을(를) 끝까지 읽었다면 인증해요. 표지에 '읽음' 도장이 찍히고 열람권 ${READ_REWARD}장을 받아요.</p>
      <span class="fl" style="margin:0">이 책은 나에게</span>
      <div class="chips">${READ_TAGS.map(t=>`<button class="chip" data-act="ctag" data-t="${t}" aria-pressed="${m.tag===t}">${t}</button>`).join('')}</div>
      <label class="fl" for="cline" style="margin:4px 0 0">가장 기억에 남는 장면이나 한 줄 감상</label>
      <input type="text" id="cline" maxlength="60" value="${esc(m.line||'')}" placeholder="예) 제비 다리를 고쳐 주는 장면이 따뜻했어요.">
      <div class="counter"><span id="ccnt">${(m.line||'').length}</span>/60</div>
      <div class="row"><button class="btn pri" data-act="certsave">${ic('check')} 인증하기</button><button class="btn ghost" data-act="mclose">다음에 할게요</button></div></div></div>`;
  }
  if(m.type==='teacher'){
    return `<div class="modal-bg"><form class="modal" id="tform" role="dialog" aria-modal="true" aria-labelledby="mt" autocomplete="off" novalidate><h2 id="mt">${m.then==='seed'?'예시 이야기 넣기':'투표 마감'}</h2>
      <p class="sub">${m.then==='seed'?`선생님만 할 수 있어요. 흥부와 놀부, 장화홍련, 혹부리 영감 등 예시 이야기 ${sampleMissing().length}편을 책장에 넣어요.`:'투표 마감은 선생님만 할 수 있어요. 마감하면 표를 가장 많이 받은 글이 다음 장면이 돼요.'}</p>
      <label class="fl" for="tpin" style="margin:0">교사 번호</label>
      <input type="password" id="tpin" inputmode="numeric" maxlength="8" autocomplete="off">
      <p class="amsg" role="alert">${esc(m.msg||'')}</p>
      <div class="row"><button class="btn pri" type="submit">${m.then==='seed'?'넣기':'마감하기'}</button><button class="btn ghost" type="button" data-act="mclose">취소</button></div></form></div>`;
  }
  return '';
}

/* 첫 화면 영상: 파일 이름만 적으면 화면 가득 자동 재생된다(소리 없음, 반복).

/* 슬라이드: 자동으로 옆으로 넘어간다. 마우스를 올리거나 만지는 동안은 멈춘다.
   손가락·마우스로 직접 밀어서 넘길 수도 있다(가로 스크롤 스냅). */
let sliderTimer=null,sliderPause=false;
function bindSlider(){
  clearInterval(sliderTimer);sliderPause=false;
  const el=$('#slides');if(!el)return;
  ['mouseenter','focusin','touchstart','pointerdown'].forEach(ev=>el.addEventListener(ev,()=>{sliderPause=true},{passive:true}));
  ['mouseleave','focusout','touchend'].forEach(ev=>el.addEventListener(ev,()=>setTimeout(()=>{sliderPause=false},2500)));
  const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;   /* 동작 줄이기: 부드럽게 미끄러지지 않고 바로 바뀐다 */
  sliderTimer=setInterval(()=>{
    const s=$('#slides');if(!s){clearInterval(sliderTimer);return}
    if(sliderPause||document.hidden)return;
    const rc=s.getBoundingClientRect();if(rc.bottom<0||rc.top>innerHeight)return;
    const i=Math.round(s.scrollLeft/s.clientWidth);
    s.scrollTo({left:((i+1)%s.children.length)*s.clientWidth,behavior:calm?'auto':'smooth'});
  },calm?6000:4000);
}

function initMaker(){
  const cv=$('#pad');if(!cv)return;
  const ctx=cv.getContext('2d');ctx.lineCap='round';ctx.lineJoin='round';
  let down=false,last=null;
  const pos=e=>{const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}};
  const stroke=(a,b)=>{
    ctx.globalCompositeOperation=draft.tool==='eraser'?'destination-out':'source-over';
    ctx.strokeStyle=draft.color;ctx.lineWidth=draft.tool==='eraser'?18:6;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();draft.dirty=true};
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);down=true;const p=pos(e);last=p;stroke(p,p)};
  cv.onpointermove=e=>{if(!down)return;const p=pos(e);stroke(last,p);last=p};
  cv.onpointerup=cv.onpointercancel=()=>{down=false};

  const layer=$('#stklayer'),cover=$('#padcover');let drag=null;
  layer.onpointerdown=e=>{
    const el=e.target.closest('.c-stk');if(!el){selectStk(-1);return}
    const i=+el.dataset.si;selectStk(i);
    const r=cover.getBoundingClientRect();drag={i,el,r};layer.setPointerCapture(e.pointerId);e.preventDefault();
  };
  layer.onpointermove=e=>{if(!drag)return;const {r,i,el}=drag;
    const x=Math.max(4,Math.min(96,(e.clientX-r.left)/r.width*100)),y=Math.max(4,Math.min(96,(e.clientY-r.top)/r.height*100));
    draft.stk[i].x=Math.round(x*10)/10;draft.stk[i].y=Math.round(y*10)/10;el.style.left=x+'%';el.style.top=y+'%'};
  layer.onpointerup=layer.onpointercancel=()=>{drag=null};

  const pt=$('#padtitle');let tdrag=null;
  pt.onpointerdown=e=>{if(draft.mode!=='title')return;const r=cover.getBoundingClientRect();tdrag={r};pt.setPointerCapture(e.pointerId);e.preventDefault()};
  pt.onpointermove=e=>{if(!tdrag)return;const {r}=tdrag;
    draft.tx=Math.round(Math.max(10,Math.min(90,(e.clientX-r.left)/r.width*100))*10)/10;
    draft.ty=Math.round(Math.max(5,Math.min(95,(e.clientY-r.top)/r.height*100))*10)/10;applyTitlePos()};
  pt.onpointerup=pt.onpointercancel=()=>{tdrag=null};
  $('#bgcustom').oninput=e=>{draft.bgc=e.target.value;cover.style.background=draft.bgc;document.querySelectorAll('[data-act=pbg]').forEach(b=>b.classList.remove('on'))};
  $('#phfile').onchange=e=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;
    if(!/^image\//.test(f.type)){toast('그림 파일만 올릴 수 있어요');return}
    const rd=new FileReader();
    rd.onload=()=>{const img=new Image();img.onload=()=>{
        const MAX=560,k=Math.min(1,MAX/Math.max(img.width,img.height));
        const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        draft.photo=c.toDataURL('image/jpeg',.72);const ph=$('#ph');ph.src=draft.photo;ph.style.objectFit=draft.fit;ph.hidden=false;toast('사진을 표지에 넣었어요');
      };img.onerror=()=>toast('이 사진은 열 수 없어요. 다른 사진을 골라 주세요');img.src=rd.result};
    rd.readAsDataURL(f);e.target.value='';
  };
  $('#tsize').oninput=e=>{draft.tsize=+e.target.value;$('#padtitle').style.fontSize=draft.tsize+'cqw'};
  $('#ssize').oninput=e=>{if(draft.sel<0)return;draft.stk[draft.sel].s=+e.target.value;const el=layer.querySelector(`[data-si="${draft.sel}"]`);if(el)el.style.fontSize=e.target.value+'cqw'};
}

/* ============ 동작 ============ */
function simCand(s){
  const used=new Set(s.cands.map(c=>c.by));
  const by=pick(FRIENDS.filter(f=>!used.has(f)&&f!==S.me.name));
  return {id:uid(),by,text:pick(SIM_LINES),votes:0,mission:Math.random()<.4?pick(MISSIONS):null};
}
function adoptIn(s,w){s.segments.push({by:w.by,text:w.text,mission:w.mission||null,candId:w.id});s.cands=[];s.voteOpen=false}
function voteIn(s,cid){
  if(!s.voteOpen)return false;
  const c=s.cands.find(x=>x.id===cid);if(!c)return false;
  c.votes++;
  if(c.votes>ADOPT_OVER){adoptIn(s,c);return {adopted:{by:c.by}}}
  return {};
}
function afterAdopt(id,r){
  if(!r||!r.adopted)return;
  const s=story(id);if(s)ui.pg[id]=Math.max(0,s.segments.length-1);
  syncAdopted();render(true);toast(`${r.adopted.by}의 글이 다음 장면이 됐어요`);
}
function closeVoteNow(id){
  mutStory(id,s=>{
    if(!s.voteOpen||!s.cands.length)return false;
    const max=Math.max(...s.cands.map(c=>c.votes)),w=pick(s.cands.filter(c=>c.votes===max));
    adoptIn(s,w);return {adopted:{by:w.by}};
  }).then(r=>afterAdopt(id,r));
}
/* 체험 모드에서만: 다른 친구들의 투표를 흉내 낸다 */
function simVotes(id,round=0){
  if(CLOUD)return;
  const s=story(id);if(!s||!s.voteOpen)return;
  const n=1+Math.floor(Math.random()*2);let r={};
  mutStory(id,x=>{for(let i=0;i<n&&x.voteOpen;i++){const q=voteIn(x,pick(x.cands).id);if(q&&q.adopted)r=q}return r});
  if(r.adopted){afterAdopt(id,r);return}
  render(true);
  if(round===0)toast('다른 친구들이 투표하고 있어요');
  if(round<6)setTimeout(()=>simVotes(id,round+1),1500);
}
async function submitWrite(id){
  const s=story(id),t=($('#wtext').value||'').trim();
  if(!s)return;
  if(!t){toast('이야기를 써 주세요');return}
  const warn=checkStory(t);
  if(warn){const w=$('#wwarn');w.textContent=warn;w.hidden=false;$('#wtext').focus();return}
  const mi=usedMission(id),me=S.me.name;
  const cand={id:uid(),by:me,text:t,votes:0,mission:mi};
  const btn=$('[data-act=write]');if(btn)btn.disabled=true;
  const r=await mutStory(id,x=>{
    if(x.voteOpen){
      if(x.cands.length>=MAX_CANDS||x.cands.some(c=>c.by===me))return false;
      x.cands.push({...cand});return 'cand';
    }
    if(CLOUD){x.cands=[{...cand}];x.voteOpen=true;return 'open'}
    if(Math.random()<0.7){x.cands=[{...cand},simCand(x)].sort(()=>Math.random()-.5);x.voteOpen=true;return 'open2'}
    adoptIn(x,cand);return 'direct';
  });
  if(r===false){if(btn)btn.disabled=false;toast('후보 자리가 이미 다 찼어요. 투표가 끝나면 다시 써 주세요');render(true);return}
  const reward=WRITE_REWARD+(mi?MISSION_BONUS:0);
  S.passes+=reward;S.mine[id]=1;S.written++;
  S.log.push({storyId:id,text:t,cat:mi?mi.cat:null,mood:s.mood,candId:cand.id,adopted:false});
  syncAdopted();
  delete ui.wd[id];delete ui.mission[id];
  const cur=story(id)||s;ui.pg[id]=cur.voteOpen?cur.segments.length:cur.segments.length-1;
  save();
  if(!S.drawer.some(d=>d.storyId===id))ui.modal={type:'part',storyId:id,stickers:[pick(STICKERS)],ribbon:RIBBONS[0]};
  const msg={cand:'후보로 등록했어요',open:'투표가 열렸어요. 친구들이 다음 장면을 골라요',open2:'다른 친구의 글과 함께 투표가 열렸어요',direct:'투표 없이 바로 이어졌어요'}[r]||'등록했어요';
  render(true);toast(`열람권 +${reward}${mi?' (미션 보너스 포함)':''} · ${msg}`);
}

    case 'unlockgo':{const s=story(d.id);if(!s)return;if(unlocked(s)){ui.modal=null;go('/story/'+s.id);break}
      if(S.passes<OPEN_COST){toast('열람권이 부족해요. 새 릴레이를 시작하거나 원작을 읽으면 받아요');return}
      S.passes-=OPEN_COST;S.viewed.push(s.id);mutStory(s.id,x=>{x.reads=(x.reads||0)+1});ui.modal=null;ui.pg[s.id]=0;save();toast(`열람권 ${OPEN_COST}장을 썼어요 · 남은 ${S.passes}장`);
      if(parse().p==='story'&&parse().id===s.id)render();else go('/story/'+s.id);break}
    case 'vote':{const s=story(d.id),c=s&&s.cands.find(x=>x.id===d.c);
      if(!c||s.cands.some(x=>x.id===S.myVotes[s.id])||c.by===S.me.name)return;
      S.myVotes[s.id]=c.id;save();
      mutStory(s.id,x=>voteIn(x,c.id)).then(r=>{afterAdopt(s.id,r);if(!CLOUD&&!(r&&r.adopted))setTimeout(()=>simVotes(s.id),900)});
      render(true);break}
    case 'seedask':if(ui.teacher){seedSamples();break}
      ui.modal={type:'teacher',then:'seed',msg:''};renderModal();break;
    case 'closevote':if(ui.teacher){closeVoteNow(d.id);break}
      ui.modal={type:'teacher',id:d.id,msg:''};renderModal();break;
    case 'pg':{const s=story(d.id);ui.pg[s.id]=Math.max(0,Math.min(s.segments.length,(ui.pg[s.id]||0)+(+d.d)));render();break}
    case 'write':submitWrite(d.id);break;
    case 'trailer':{const s=story(d.id);if(!unlocked(s)){toast('먼저 열람권으로 이야기를 읽어 주세요');return}screen=null;playTrailer(s);break}
    case 'mstk':{const m=ui.modal,i=m.stickers.indexOf(d.s);if(i>=0)m.stickers.splice(i,1);else if(m.stickers.length<3)m.stickers.push(d.s);else toast('스티커는 3개까지 고를 수 있어요');renderModal();break}
    case 'mrib':ui.modal.ribbon=d.r;renderModal();break;
    case 'savepart':{const m=ui.modal,s=story(m.storyId);
      S.drawer.push({storyId:s.id,role:'참여',cover:{...lite(s.cover),stickers:m.stickers.slice(),ribbon:m.ribbon},at:Date.now()});
      ui.modal=null;save();render(true);toast('서랍에 표지를 보관했어요');break}
    case 'newstart':startStory();break;
    /* 미션 카드 */
    case 'mreroll':{const m=getMission(d.k);if(m.rerolls<1)return;let n;do{n=Math.floor(Math.random()*MISSIONS.length)}while(n===m.i);m.i=n;m.rerolls--;m.on=true;
      const el=$('#mc-'+d.k);if(el)el.outerHTML=missionHTML(d.k);break}
    case 'mtoggle':{const m=getMission(d.k);m.on=t.checked;const el=$('#mc-'+d.k);if(el)el.classList.toggle('off',!m.on);break}
    /* 원작 읽기 인증 */
    case 'cert':ui.modal={type:'cert',book:d.b,tag:null,line:''};renderModal();break;
    case 'ctag':ui.modal.tag=d.t;pressIn(t,'[data-act=ctag]');break;
    case 'certsave':saveCert();break;
    case 'mclose':ui.modal=null;renderModal();break;
    /* 랜덤 책 주사위 */
    case 'dice':{
      if(!S.stories.length)break;
      const ids=S.stories.map(s=>s.id).filter(i=>i!==ui.lastDice),id=pick(ids.length?ids:S.stories.map(s=>s.id));
      ui.lastDice=id;ui.modal={type:'dice',rolling:true,id};renderModal();
      setTimeout(()=>{if(ui.modal&&ui.modal.type==='dice'&&ui.modal.id===id){ui.modal.rolling=false;renderModal()}},matchMedia('(prefers-reduced-motion: reduce)').matches?350:1000);
      break}
    case 'dicego':{const s=story(d.id);if(unlocked(s)){ui.modal=null;renderModal();go('/story/'+s.id)}else{ui.modal={type:'unlock',id:s.id};renderModal()}break}
    /* 작가 명함 */
    case 'cedit':ui.editCard=!ui.editCard;render(true);break;
    case 'cav':S.card.av=d.a||null;save();render(true);break;
    case 'ccolor':S.card.c=+d.i;save();render(true);break;
    case 'cline':S.card.line=d.t;save();render(true);break;
    /* 시사회 */
    case 'lineup':{const ids=lineupIds(),i=ids.indexOf(d.id);if(t.checked&&i<0)ids.push(d.id);if(!t.checked&&i>=0)ids.splice(i,1);
      const h=$('.marquee h2');if(h)h.textContent=luTitle(ids.length);const b=$('[data-act=screen]');if(b)b.disabled=!ids.length;const a=$('[data-act=luall]');if(a)a.textContent=ids.length===S.stories.length?'모두 해제':'모두 선택';break}
    case 'luall':{ui.lineup=lineupIds().length===S.stories.length?[]:S.stories.map(s=>s.id);render(true);break}
    case 'ledit':ui.luEdit=ui.luEdit===d.id?null:d.id;render(true);break;
    case 'lubg':{const c=d.c;mutStory(d.id,x=>{x.fx=x.fx||{};if(c)x.fx.bg=c;else delete x.fx.bg});render(true);break}
    case 'lureset':{mutStory(d.id,x=>{delete x.fx});render(true);break}
    case 'screen':{const ids=S.stories.filter(s=>lineupIds().includes(s.id)).map(s=>s.id);if(!ids.length)return;screen={ids,i:0,got:{}};playTrailer(story(ids[0]));break}
    /* 표지 만들기 */
    case 'emode':setMode(d.m);break;
    case 'ptool':draft.tool=d.t;setOn(t);break;
    case 'pcolor':draft.color=d.c;draft.tool='pen';setOn(t);document.querySelectorAll('[data-act=ptool]').forEach(b=>b.classList.toggle('on',b.dataset.t==='pen'));break;
    case 'pclear':{const cv=$('#pad');cv.getContext('2d').clearRect(0,0,cv.width,cv.height);draft.dirty=false;break}
    case 'pbg':draft.g=+d.i;draft.bgc=null;$('#padcover').style.background=COLORS[draft.g];setOn(t);break;
    case 'pfit':draft.fit=d.f;pressIn(t,'[data-act=pfit]');$('#ph').style.objectFit=d.f;break;
    case 'pdel':draft.photo=null;$('#ph').hidden=true;$('#ph').removeAttribute('src');break;
    case 'tfont':draft.font=d.f;setOn(t);$('#padtitle').style.fontFamily=fontCss(d.f);break;
    case 'tpos':draft.tpos=d.p;draft.tx=null;draft.ty=null;pressIn(t,'[data-act=tpos]');applyTitlePos();break;
    case 'tcolor':draft.tc=d.c;setOn(t);$('#padtitle').style.color=d.c;break;
    case 'sadd':{if(draft.stk.length>=12){toast('스티커는 12개까지 붙일 수 있어요');return}
      draft.stk.push({e:d.e,x:30+Math.random()*40,y:40+Math.random()*30,s:14});draft.sel=draft.stk.length-1;renderStk();break}
    case 'sdel':if(draft.sel>=0){draft.stk.splice(draft.sel,1);draft.sel=-1;renderStk()}break;
  }
});

/* 페이지 넘기기: 방향키, 스와이프 */
function turn(d){
  if(parse().p!=='story'||!$('#trailer').hidden)return;
  const b=document.querySelector(`[data-act=pg][data-d="${d}"]`);
  if(b&&!b.disabled)b.click();
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&ui.modal&&ui.modal.type!=='part'){ui.modal=null;renderModal();return}
  if(e.key==='Escape'&&!$('#trailer').hidden){closeTrailer();return}
  if(!$('#trailer').hidden){   /* 예고편·시사회: 스페이스 = 일시 정지, 좌우 방향키 = 이전·다음 이야기 */
    const onBtn=e.target.closest&&e.target.closest('button,a');
    if(e.key===' '&&!onBtn){e.preventDefault();togglePause()}
    else if(e.key==='ArrowRight')tNav(1);else if(e.key==='ArrowLeft')tNav(-1);
    return;
  }
  if(e.target.closest&&e.target.closest('input,textarea'))return;
  if(e.key==='ArrowRight')turn(1);else if(e.key==='ArrowLeft')turn(-1);
});
let tx=null;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{
  if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;
  if(Math.abs(dx)<70||(e.target.closest&&e.target.closest('input,textarea,canvas,.cover,.chips')))return;
  turn(dx<0?1:-1);
},{passive:true});

/* ============ 예고편 연출 + 배경음 ============ */
const Aud={ctx:null,on:true,nodes:[],timer:null,master:null,
  start(mood){
    mood=(MOODS[mood]||{}).music||mood;
    if(!this.on)return;this.stop();
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const c=this.ctx=this.ctx||new AC();if(c.state==='suspended')c.resume();
    const cfg={mystery:{root:110,pad:[0,3,7],scale:[0,3,5,7,10],tempo:1100,wave:'sine',oct:[2,4]},
               touch:{root:130.81,pad:[0,4,7],scale:[0,2,4,7,9],tempo:800,wave:'triangle',oct:[2,4]},
               fun:{root:196,pad:[0,4,7],scale:[0,2,4,7,9],tempo:300,wave:'square',oct:[1,2]}}[mood];
    const m=this.master=c.createGain();m.gain.value=0;m.gain.linearRampToValueAtTime(.5,c.currentTime+1.5);m.connect(c.destination);
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=mood==='fun'?1800:900;lp.connect(m);
    cfg.pad.forEach(s=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=cfg.root*Math.pow(2,s/12);g.gain.value=.07;o.connect(g);g.connect(lp);o.start();this.nodes.push(o)});
    const note=()=>{
      const o=c.createOscillator(),g=c.createGain(),n=pick(cfg.scale),oc=pick(cfg.oct);
      o.type=cfg.wave;o.frequency.value=cfg.root*Math.pow(2,n/12)*oc;
      const t=c.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(mood==='fun'?.05:.09,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+(mood==='fun'?.3:1.6));
      o.connect(g);g.connect(lp);o.start(t);o.stop(t+2);};
    note();this.timer=setInterval(note,cfg.tempo);
  },
  stop(){
    clearInterval(this.timer);this.timer=null;
    const c=this.ctx,m=this.master,ns=this.nodes;this.nodes=[];this.master=null;
    if(c&&m){m.gain.cancelScheduledValues(c.currentTime);m.gain.setValueAtTime(m.gain.value,c.currentTime);m.gain.linearRampToValueAtTime(0,c.currentTime+.4);
      setTimeout(()=>{ns.forEach(o=>{try{o.stop()}catch(e){}});try{m.disconnect()}catch(e){}},500)}
  }};
let tTimers=[];
let tPlay=null;   /* 지금 재생 중인 예고편의 상태: 일시 정지·다음/이전 이야기에 쓴다 */
function closeTrailer(){
  tTimers.forEach(clearTimeout);tTimers=[];Aud.stop();
  if(tPlay){clearTimeout(tPlay.timer);tPlay=null}$('#trailer').classList.remove('paused');
  const wasOpen=!$('#trailer').hidden;$('#trailer').hidden=true;
  const wasScreen=screen;screen=null;
  if(wasScreen&&wasOpen){save();if(parse().p===''&&ui.tab==='screening')render(true)}
  if(pendingRender)setTimeout(scheduleRender,0);
}
$('#t-close').onclick=closeTrailer;
$('#t-sound').onclick=()=>{Aud.on=!Aud.on;$('#t-sound').textContent=Aud.on?'소리 켜짐':'소리 꺼짐';$('#t-sound').setAttribute('aria-pressed',Aud.on);
  if(Aud.on&&!$('#trailer').hidden&&$('#trailer').dataset.mood)Aud.start($('#trailer').dataset.mood);else Aud.stop()};
function addLine(st,cls,html){
  [...st.children].forEach(k=>k.classList.add('old'));
  const d=document.createElement('div');d.className='line '+cls;d.innerHTML=html;st.appendChild(d);
  requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add('show')));return d;
}
function playTrailer(s){
  const tr=$('#trailer'),st=$('#t-stage');
  tTimers.forEach(clearTimeout);tTimers=[];st.innerHTML='';
  if(tPlay)clearTimeout(tPlay.timer);tr.classList.remove('paused');tr.classList.toggle('solo',!screen);
  const fx=fxOf(s),tbg=fx.bg||MOODS[s.mood].bg;
  tr.hidden=false;tr.style.background=tbg;tr.style.color=isLight(tbg)?'#111':'#fff';tr.classList.toggle('light',isLight(tbg));tr.style.setProperty('--tz',fx.sz||1);tr.dataset.mood=s.mood;
  $('#t-info').textContent=screen?`우리 반 시사회 · ${screen.i+1} / ${screen.ids.length}`:'예고편';
  Aud.start(s.mood);
  const lines=[];
  s.segments.forEach(seg=>{(seg.text.match(/[^.!?…]+[.!?…]*["'」』”’]*/g)||[seg.text]).forEach(x=>{x=x.trim();if(x)lines.push(x)})});
  const authors=[...new Set(s.segments.map(x=>x.by))];
  const seq=[
    {t:screen?`상영작 ${screen.i+1}`:'책꼬리',c:'small',ms:1600},
    {t:s.title,c:'big',ms:2600},
    {t:'원작 『'+s.book.title+'』',c:'small',ms:1800},
    ...lines.map(x=>({t:x,c:'',ms:Math.max(2300,x.length*85)})),
    {t:'쓴 사람 · '+authors.join(', '),c:'small',ms:2600}
  ];
  /* 한 단계씩 진행한다(일시 정지하면 남은 시간을 기억했다가 이어서 간다) */
  const p=tPlay={s,seq,i:0,paused:false,ended:false,timer:null,t0:0,left:0,next:null};
  const run=(ms,fn)=>{p.left=ms;p.t0=Date.now();p.next=fn;p.timer=setTimeout(fn,ms)};
  const step=()=>{
    if(tPlay!==p)return;
    if(p.i>=p.seq.length){p.ended=true;screen?screenEnd(s):trailerEnd(s);return}
    const item=p.seq[p.i];
    while(st.children.length>4)st.removeChild(st.firstChild);
    addLine(st,item.c,esc(item.t));
    run(item.ms,()=>{p.i++;step()});
  };
  run(300,step);
}
function setPaused(on){
  const p=tPlay,tr=$('#trailer');if(!p||p.ended)return;
  if(on&&!p.paused){clearTimeout(p.timer);p.left=Math.max(200,p.left-(Date.now()-p.t0));p.paused=true;tr.classList.add('paused');Aud.stop()}
  else if(!on&&p.paused){p.paused=false;tr.classList.remove('paused');Aud.start(tr.dataset.mood);p.t0=Date.now();p.timer=setTimeout(p.next,p.left)}
}
const togglePause=()=>{const p=tPlay;if(p&&!p.ended)setPaused(!p.paused)};
/* 시사회: 다음 이야기로 바로 넘어가거나 이전 이야기로 돌아간다 */
function tNav(d){
  if(!screen)return;
  const ids=screen.ids,last=ids.length-1;
  if(d>0){
    if(screen.i>=last){if(tPlay&&tPlay.ended)return;if(tPlay){clearTimeout(tPlay.timer);tPlay.ended=true}$('#trailer').classList.remove('paused');screenEnd(story(ids[screen.i]));return}
    screen.i++;
  }else if(screen.i>0)screen.i--;
  playTrailer(story(ids[screen.i]));
}
$('#trailer').addEventListener('click',e=>{if(e.target.closest('button,a,.t-bar'))return;togglePause()});
$('#t-nav-prev').onclick=()=>tNav(-1);
$('#t-nav-next').onclick=()=>tNav(1);
function trailerEnd(s){
  const st=$('#t-stage');
  addLine(st,'card','원작을 읽어 보세요<br><b>『'+esc(s.book.title)+'』</b>'+(s.book.author?' · '+esc(s.book.author):'')+(s.book.reason?'<br><small>'+esc(s.book.reason)+'</small>':''));
  const done=!!myCert(s.book.title);
  const e=document.createElement('div');e.className='line t-end';
  e.innerHTML=`<button class="btn pri" id="t-cert" ${done?'disabled':''}>${done?'인증 완료':'원작 읽었어요'}</button><button class="btn" id="t-again">다시 보기</button><a class="btn" target="_blank" rel="noopener" href="${bookLink(s.book)}">책 찾기</a>`;
  st.appendChild(e);
  $('#t-again').onclick=()=>playTrailer(s);
  $('#t-cert').onclick=()=>{ui.modal={type:'cert',book:s.book.title,tag:null,line:''};renderModal()};
  requestAnimationFrame(()=>requestAnimationFrame(()=>e.classList.add('show')));
}
function screenEnd(s){
  s=story(s.id)||s;
  const st=$('#t-stage');st.innerHTML='';
  s.cheers=s.cheers||{thrill:0,touch:0,laugh:0};
  addLine(st,'small','공감 버튼을 눌러 마음을 모아 주세요');
  addLine(st,'big',esc(s.title));
  const rx=document.createElement('div');rx.className='line rx show';
  rx.innerHTML=Object.keys(CHEERS).map(k=>`<button data-k="${k}"><b>${s.cheers[k]||0}</b>${CHEERS[k]}</button>`).join('');
  st.appendChild(rx);
  rx.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const k=b.dataset.k;
    mutStory(s.id,x=>{x.cheers=x.cheers||{thrill:0,touch:0,laugh:0};x.cheers[k]=(x.cheers[k]||0)+1});
    screen.got[s.id]=(screen.got[s.id]||0)+1;const cur=story(s.id)||s;b.querySelector('b').textContent=(cur.cheers||{})[k]||0};
  const last=screen.i>=screen.ids.length-1;
  const e=document.createElement('div');e.className='line t-end show';
  e.innerHTML=last?`<button class="btn pri" id="t-next">관객상 발표</button>`:`<button class="btn pri" id="t-next">다음 상영작</button><button class="btn" id="t-stop">시사회 마치기</button>`;
  st.appendChild(e);
  $('#t-next').onclick=()=>{save();if(last){screenAward();return}screen.i++;playTrailer(story(screen.ids[screen.i]))};
  const stop=$('#t-stop');if(stop)stop.onclick=closeTrailer;
}
function screenAward(){
  const st=$('#t-stage');st.innerHTML='';Aud.stop();
  const best=Object.entries(screen.got).sort((a,b)=>b[1]-a[1])[0];
  $('#t-info').textContent='우리 반 시사회 · 관객상';
  addLine(st,'small','오늘의 관객상');
  if(best){const s=story(best[0]);addLine(st,'big',esc(s.title));addLine(st,'',`공감 ${best[1]}개 · 쓴 사람 ${esc([...new Set(s.segments.map(x=>x.by))].join(', '))}`)}
  else addLine(st,'','오늘은 공감이 모이지 않았어요. 다음 시사회에서 만나요!');
  const e=document.createElement('div');e.className='line t-end show';
  e.innerHTML='<button class="btn pri" id="t-done">시사회 마치기</button>';st.appendChild(e);
  $('#t-done').onclick=closeTrailer;
}

/* 반 전체 공유 모드: 이 기기에 로그인 기록이 있으면 다시 들어간다 */
if(CLOUD){
  const ss=Sess.get();
  if(ss&&ss.cls&&ss.nick){
    Cloud.resume(ss.cls,ss.nick).then(r=>{
      if(!r.ok){Sess.set(null);return}
      S=blank();S.me.cls=ss.cls;Cloud.start(ss.cls);enterUser(ss.nick,r.u);render();
    });
  }
}
render();
